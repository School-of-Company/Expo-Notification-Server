name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'NODE'
          const title = process.env.TITLE;
          if (!title.trim() || [...title].length > 50 ||
              /[\p{Cc}\p{Extended_Pictographic}\p{Emoji_Presentation}]|\u20e3|^\[[^\]]+\]/u.test(title)) {
            console.error('PR title must be a description of at most 50 characters, without a scope prefix, emojis, or control characters.');
            process.exit(1);
          }
          NODE

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:ci

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit --incremental false
      - run: pnpm test --runInBand
      - run: pnpm test:e2e --runInBand
      - run: pnpm run build
